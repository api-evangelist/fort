aid: fort
name: Fort
description: >-
  Fort is a Y Combinator (W26) hardware startup building a screenless wearable
  that automatically tracks strength training for people who care about
  longevity. Founded by three former Tesla engineers, the device uses heart
  rate and motion sensing to detect gym sessions, workout classes, sleep, and
  recovery without requiring the wearer to manually log reps, sets, or
  exercises, then delivers actionable feedback on how lifestyle factors affect
  strength progress. Fort is styled as jewelry rather than performance gear,
  ships in three finishes with 7+ day battery life, and pairs with Fort
  Foundations, an expert-led training program built around core movement
  patterns. The product is currently available for pre-order and has no public
  developer API or programmatic surface at this time; this profile captures the
  company's public web and commercial presence.
